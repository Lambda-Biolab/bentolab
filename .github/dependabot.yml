---
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Two ecosystems:
# - "uv" parses pyproject.toml + uv.lock (the previous "pip" entry was a
#   no-op for this repo since dependabot's pip ecosystem only handles
#   requirements.txt-style files, not the uv-managed pyproject layout).
# - "github-actions" keeps the SHA-pinned action references in
#   .github/workflows/ up to date with new tags. Repo rule requires
#   full commit SHA pins, which dependabot will keep current.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]

  # Note on pre-commit-hooks and conventional-pre-commit rev pins
  # in .pre-commit-config.yaml: Dependabot does not have a native
  # `pre-commit` package-ecosystem. Bump them manually with
  #   uv run pre-commit autoupdate
  # and verify the new hooks pass before merging.
