name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Standard Python project CI bundle, bentolab flavor. Mirrors
# templates/python-repo/.github/workflows/ci.yml with the
# bentolab-specific bits:
# - python-versions matrix: ['3.11', '3.12', '3.13'] (the
#   bentolab supported range — broader than the standard)
# - source paths: bentolab/ + tests/ + tools/ (bentolab has a
#   tools/ subdir for dev utilities)
# - extra-test-args: -m "not hardware" (hardware tests require
#   real Bluetooth hardware, not available in CI)
# - no complexity check yet (bentolab's tools/ has a few
#   over-threshold functions; documented for follow-up)

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        shell: bash
        run: |
          bash scripts/install-actionlint.sh
          actionlint -color

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Format check
        run: uv run ruff format --check bentolab/ tests/ tools/
      - name: Lint
        run: uv run ruff check bentolab/ tests/ tools/
      - name: Type check
        # Tests are first-class code.
        run: uv run pyright bentolab/ tests/
      - name: Test
        run: uv run pytest tests/ -v -m "not hardware"

  codeql:
    name: CodeQL
    # CodeQL MUST run on every PR so security findings block the
    # merge instead of showing up post-merge. The hosting workflow's
    # `on: pull_request:` trigger (set at the top of this file)
    # already defines the PR event — the old `if:` filter dropped it,
    # which downgraded CodeQL to post-merge advisory.
    #
    # The "merge-ref SHA races merge-protection" concern that the old
    # filter guarded against does not apply to `pull_request` triggers
    # on the workflow's own `on:` block — only to a hypothetical
    # `pull_request` trigger on a reusable file (which this inline
    # codeql isn't). Mirroring the org rule documented in
    # antomicblitz/opencode-config/templates/python-repo/.github/workflows/ci.yml.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          output: sarif-results
      - name: Dismiss alerts
        if: always()
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Syft
        env:
          SYFT_VERSION: "1.50.0"
          SYFT_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"
        run: |
          set -euo pipefail
          URL="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          curl -sSL --fail "$URL" -o "$TMP/syft.tar.gz"
          echo "$SYFT_SHA256  $TMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$TMP/syft.tar.gz" -C "$TMP"
          sudo mv "$TMP/syft" /usr/local/bin/syft
          sudo chmod +x /usr/local/bin/syft
          syft version

      - name: Generate SBOM
        env:
          SBOM_PATH: docs/SBOM/syft-scan.spdx.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SBOM_PATH")"
          syft scan dir:.             --output "spdx-json=$SBOM_PATH"             --source-name "${{ github.repository }}"             --source-version "${{ github.sha }}"
          echo "SBOM written to $SBOM_PATH"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@4cec0d85b66861bfb2afcae7b8b8e90241a86271 # v4
        with:
          name: sbom
          path: docs/SBOM/syft-scan.spdx.json
          if-no-files-found: error
          retention-days: 90
  links:
    name: Link Checker
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--config .lychee.toml ."
          fail: true
