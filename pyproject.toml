[project]
name = "bentolab"
version = "0.1.0"
description = "Python control library for Bento Lab PCR workstations"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "bleak>=0.22.0",
    "platformdirs>=4.11.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
]
tools = [
    "construct>=2.10.0",
    "zeroconf>=0.80.0",
    "pyshark>=0.6.0",
    "scapy>=2.5.0",
    "aiohttp>=3.14.3",
    "prompt-toolkit>=3.0.53",
]
tui = [
    "textual>=0.79",
]





[project.scripts]
bentolab = "bentolab.cli.main:main"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "textual>=0.79",
    "ruff>=0.16.1",
    "httpx>=0.27.0",  # required by fastapi.testclient.TestClient
    "pyright>=1.1.0",
    "complexipy>=6.2.0",
    "aiohttp>=3.14.3",
    "requests>=2.31",  # lab-copilot-gateway HttpBentoLabClient
    "pytest-cov>=5.0",  # coverage gate (make test-cov)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Note: there is intentionally NO `addopts = "-m \"not hardware\""` here.
# The Makefile (test, test-cov) and CI (ci.yml) pass `-m "not hardware"`
# explicitly. Without addopts, `pytest -m hardware` works as expected
# for local hardware-test runs.
markers = [
    "hardware: requires physical Bento Lab device",
    "slow: slow-running tests (stress, soak, multi-second)",
    "network: tests that require real BLE/Wi-Fi hardware or mock network I/O",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "S", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["S"]   # tools are debug scripts; S rules (bandit) are advisory
"tests/*" = ["S101", "S"]   # assert is pytest idiom; tests don't ship

[tool.complexipy]
max-complexity = 15
exclude = ["tests/", "tools/"]

[tool.coverage.run]
source = ["bentolab"]
omit = ["bentolab/_data_dirs.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.pyright]
# Tests are first-class code — type-check them here so the CI gate
# (which runs `pyright bentolab/ tests/`) and the in-repo config stay
# in sync. Excluding tests/ hides real type errors that the v1.4.0
# closeout for bioml-tools found in 66 places.
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["bentolab", "tests"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.*",
]
typeCheckingMode = "standard"
reportMissingTypeStubs = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalOperand = true
reportOptionalIterable = true
reportOptionalCall = true

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bentolab*"]

[tool.setuptools.package-data]
"bentolab.tui" = ["style.tcss", "ascii-art/*.txt"]
