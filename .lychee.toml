# Lychee link checker config
accept = [200, 201, 204, 429]
timeout = 30
max_retries = 2

exclude = [
    "^https://img\\.shields\\.io",
    "^https://github\\.com/Lambda-Biolab/",
    "^https://hub\\.docker\\.com",
    "^https://pypi\\.org",
    # EUR-Lex is behind a CloudFront WAF that returns 202 to
    # HEAD/curl requests (it serves a JS challenge page to
    # non-browser clients). The URLs themselves are correct and
    # load fine in a browser -- they're just unreachable by
    # automated link checkers. The legal reference is intentional
    # in docs/LICENSING_ASSESSMENT.md.
    "^https://eur-lex\\.europa\\.eu",
    # bento.bio (Bento Bioworks) blocks HEAD/curl requests with a
    # 403 (Cloudflare WAF). The URL is real and used in the vendor
    # attribution in docs/LICENSING_ASSESSMENT.md.
    "^https://bento\\.bio",
]
